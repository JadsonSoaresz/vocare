<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorar Profissões — Vocare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/mobile.css">
  <style>
    /* ── Página ── */
    .prof-wrap { max-width: 1200px; margin: 0 auto; padding: 0 var(--space-4); }
    .professions-header { padding: calc(var(--nav-height) + var(--space-10)) 0 var(--space-6); }
    .professions-header-inner { display: grid; gap: var(--space-6); align-items: end; }
    @media (min-width: 900px) { .professions-header-inner { grid-template-columns: 1.2fr 1fr; } }
    .professions-header h1 {
      font-size: clamp(2rem, 4.5vw, 3.25rem); line-height: 1.05; letter-spacing: -0.025em;
      margin: var(--space-3) 0 var(--space-3);
    }
    .professions-header h1 em { font-style: italic; color: var(--color-primary); }
    .professions-header p { color: var(--color-muted); font-size: var(--text-base); margin: 0; max-width: 460px; }
    .professions-search-wrap .search-bar {
      background: var(--color-card); border: 1px solid var(--color-border);
      padding: 0.875rem var(--space-5); box-shadow: var(--shadow-card);
    }
    .professions-search-wrap .search-bar input { font-size: var(--text-base); }
    .header-mosaic { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: var(--space-4); }
    .header-mosaic span { aspect-ratio: 1; border-radius: 14px; background: center / cover; }
    @media (max-width: 899px) { .header-mosaic { display: none; } }

    /* Filtros fixos */
    .professions-filters {
      position: sticky; top: var(--nav-height); z-index: var(--z-sticky);
      background: rgba(246, 244, 239, 0.9);
      -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--color-border-light);
      padding: var(--space-3) 0;
    }
    .results-bar { padding: var(--space-5) 0 var(--space-2); font-size: var(--text-sm); color: var(--color-muted); font-weight: 600; }

    /* Grade */
    .professions-grid {
      display: grid; gap: var(--space-5); padding: var(--space-2) 0 var(--space-16);
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr));
    }
    @media (max-width: 520px) {
      .professions-grid { grid-template-columns: 1fr 1fr; gap: var(--space-3); }
      .profession-grid-name { font-size: 1rem; }
      .profession-grid-body, .profession-grid-footer { padding-left: var(--space-3); padding-right: var(--space-3); }
      .profession-grid-salary { font-size: var(--text-xs); }
    }

    /* Card */
    .profession-grid-card {
      display: flex; flex-direction: column;
      background: var(--color-card); border: 1px solid var(--color-border-light); border-radius: 20px;
      overflow: hidden; cursor: pointer; box-shadow: var(--shadow-card);
      transition: transform var(--duration-base) var(--ease), box-shadow var(--duration-base) var(--ease);
    }
    .profession-grid-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
    .profession-grid-card:focus-visible { outline: 2px solid var(--color-text); outline-offset: 3px; }
    .profession-grid-thumb { position: relative; width: 100%; aspect-ratio: 16/10; background: var(--color-primary) center / cover; transition: transform 600ms var(--ease); }
    .profession-grid-card:hover .profession-grid-thumb { transform: scale(1.03); }
    .profession-grid-thumb .thumb-outlook {
      position: absolute; left: 12px; bottom: 12px;
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(255,255,255,0.94); color: var(--color-text);
      font-size: 0.7rem; font-weight: 700; padding: 0.25rem 0.6rem; border-radius: 999px;
    }
    .profession-grid-body { padding: var(--space-4) var(--space-4) var(--space-2); flex: 1; position: relative; background: var(--color-card); }
    .profession-grid-area-badge { margin-bottom: var(--space-2); }
    .profession-grid-area-badge .badge { background: none; padding: 0; color: var(--color-muted); font-size: 0.7rem !important; letter-spacing: 0.06em; text-transform: uppercase; font-weight: 700; }
    .profession-grid-name {
      font-family: var(--font-display); font-weight: 600; font-size: 1.1875rem; line-height: 1.2;
      color: var(--color-text); margin-bottom: var(--space-2);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .profession-grid-salary { font-size: var(--text-sm); color: var(--color-text-soft); margin-bottom: var(--space-2); }
    .profession-grid-footer { padding: 0 var(--space-4) var(--space-4); background: var(--color-card); position: relative; }
    .profession-grid-footer .btn {
      border: none; background: none; padding: 0; min-height: 0; justify-content: flex-start;
      font-size: var(--text-sm); font-weight: 700; color: var(--color-text); width: auto;
    }
    .profession-grid-footer .btn [data-icon] { transition: transform var(--duration-fast) var(--ease); }
    .profession-grid-card:hover .profession-grid-footer .btn [data-icon] { transform: translateX(4px); }
    /* Modal overrides */
    .modal-overlay { padding: 0; align-items: flex-end; }
    @media (min-width: 640px) { .modal-overlay { align-items: center; padding: var(--space-4); } }
    .modal {
      max-width: 600px;
      max-height: 92vh;
      border-radius: var(--radius-2xl) var(--radius-2xl) 0 0;
    }
    @media (min-width: 640px) {
      .modal { border-radius: var(--radius-2xl); }
    }
    /* modal profession header */
    .profession-modal-header {
      padding: var(--space-6) var(--space-5) var(--space-5);
      background-color: var(--color-primary);
    }
    .profession-modal-header h2 { color: #fff; font-size: var(--text-2xl); }
    .profession-modal-close {
      position: absolute;
      top: var(--space-4);
      right: var(--space-4);
      width: 36px; height: 36px;
      border-radius: var(--radius-full);
      background: rgba(12,20,36,0.45);
      -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
      border: none;
      color: #fff;
      font-size: 1.125rem;
      z-index: 2;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background var(--duration-fast) var(--ease);
    }
    .profession-modal-close:hover { background: rgba(255,255,255,0.35); }
    /* info grid */
    .profession-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: var(--space-3);
      margin: var(--space-4) 0;
    }
    .profession-info-item {
      background: var(--color-bg);
      border: 1px solid var(--color-border-light);
      border-radius: var(--radius-lg);
      padding: var(--space-3);
    }
    .profession-info-label {
      font-size: var(--text-xs);
      color: var(--color-muted);
      font-weight: var(--fw-medium);
      margin-bottom: var(--space-1);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .profession-info-value {
      font-size: var(--text-sm);
      font-weight: var(--fw-semi);
      color: var(--color-text);
    }
    /* mentor mini-card in modal */
    .modal-mentor-item {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      padding: var(--space-3);
      border-radius: var(--radius-lg);
      cursor: pointer;
      transition: background var(--duration-fast) var(--ease);
    }
    .modal-mentor-item:hover { background: var(--color-bg); }
    .modal-mentor-avatar {
      width: 44px; height: 44px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: var(--fw-bold);
      font-size: var(--text-sm);
      color: #fff;
      flex-shrink: 0;
      overflow: hidden;
      background: var(--color-bg-alt);
    }
    .modal-mentor-avatar img { width: 100%; height: 100%; object-fit: cover; }
    /* results bar */
  </style>
</head>
<body class="">

  <!-- ── Top Nav ── -->
  <nav class="top-nav" role="navigation" aria-label="Navegação principal">
    <a href="dashboard.html" class="nav-brand" aria-label="Vocare início">
      <img src="../assets/logo.png" alt="Vocare" class="nav-logo">
    </a>
        <nav class="nav-menu-desktop" aria-label="Menu principal">
      <a href="dashboard.html" class="btn btn-ghost btn-sm"><i data-icon="home"></i> Início</a>
      <a href="professions.html" class="btn btn-ghost btn-sm" style="font-weight:600;color:var(--color-primary)"><i data-icon="search"></i> Explorar</a>
      <a href="mentors.html" class="btn btn-ghost btn-sm"><i data-icon="user"></i> Mentores</a>
      <a href="voca.html" class="btn btn-ghost btn-sm"><i data-icon="message"></i> Chat IA</a>
      <a href="career-plan.html" class="btn btn-ghost btn-sm"><i data-icon="clipboard"></i> Plano</a>
      <a href="profile.html" class="btn btn-ghost btn-sm"><i data-icon="file-text"></i> Perfil</a>
      <a href="test.html" class="btn btn-ghost btn-sm"><i data-icon="target"></i> Refazer Teste</a>
    </nav>
    <div class="nav-actions">
      <div class="dropdown" style="position:relative">
        <div id="navAvatar" class="nav-avatar" role="button" tabindex="0" aria-label="Menu do usuário" aria-haspopup="true" aria-expanded="false"></div>
        <div id="navDropdown" class="dropdown-menu hidden" role="menu">
          <div style="padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--color-divider)">
            <p id="dropdownName" style="font-weight:var(--fw-semi);font-size:var(--text-sm);color:var(--color-text)"></p>
          </div>
          <button class="dropdown-item" onclick="navigate('dashboard.html')"><i data-icon="home"></i> Início</button>
          <button class="dropdown-item" onclick="navigate('career-plan.html')"><i data-icon="clipboard"></i> Meu plano</button>
          <div class="dropdown-divider"></div>
          <a href="profile.html" class="dropdown-item" role="menuitem"><i data-icon="file-text"></i> Meu perfil e currículo</a>
          <button id="logoutBtn" class="dropdown-item danger"><i data-icon="log-out"></i> Sair</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- ── Header with search ── -->
  <header class="professions-header">
    <div class="prof-wrap professions-header-inner">
      <div>
        <span class="eyebrow">Catálogo de carreiras</span>
        <h1>Encontre a profissão <em>que combina</em> com você.</h1>
        <p>Salário, mercado de trabalho, formação e o dia a dia de cada carreira — com destaque para o que é mais compatível com o seu perfil.</p>
      </div>
      <div class="professions-search-wrap">
        <div class="search-bar" role="search">
          <span class="search-icon" aria-hidden="true"><i data-icon="search"></i></span>
          <input
            type="search"
            id="searchInput"
            placeholder="Buscar por profissão, área ou habilidade"
            autocomplete="off"
            aria-label="Buscar profissões"
          >
          <button id="clearSearch" class="btn-ghost" style="background:none;border:none;color:var(--color-muted);font-size:1rem;cursor:pointer;padding:0 var(--space-1);display:none" aria-label="Limpar busca"><i data-icon="x"></i></button>
        </div>
        <div class="header-mosaic" aria-hidden="true">
          <span data-cover="Saúde" data-seed="m1"></span>
          <span data-cover="Tecnologia" data-seed="m2"></span>
          <span data-cover="Artes" data-seed="m3"></span>
          <span data-cover="Agronegócio" data-seed="m4"></span>
        </div>
      </div>
    </div>
  </header>

  <!-- ── Filters ── -->
  <div class="professions-filters" role="toolbar" aria-label="Filtros de área">
    <div class="prof-wrap">
      <div id="filterChips" class="filter-chips">
        <button class="chip active" data-filter="all">Todas</button>
        <button class="chip" data-filter="sort-compat"><i data-icon="star"></i> Mais compatíveis</button>
        <!-- Dynamic area chips injected by JS -->
      </div>
    </div>
  </div>

  <!-- ── Profession Grid ── -->
  <main class="prof-wrap">
    <div class="results-bar" id="resultsBar" aria-live="polite" aria-atomic="true">Carregando...</div>
    <div id="professionsGrid" class="professions-grid" role="list" aria-label="Lista de profissões">
      <!-- Skeletons -->
      <div class="profession-grid-card skeleton" style="height:220px"></div>
      <div class="profession-grid-card skeleton" style="height:220px"></div>
      <div class="profession-grid-card skeleton" style="height:220px"></div>
      <div class="profession-grid-card skeleton" style="height:220px"></div>
      <div class="profession-grid-card skeleton" style="height:220px"></div>
      <div class="profession-grid-card skeleton" style="height:220px"></div>
    </div>
  </main>

  <!-- ── Profession Detail Modal ── -->
  <div id="professionModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="modalProfName">
    <div class="modal" id="professionModalInner">
      <!-- Dynamic content injected by JS -->
    </div>
  </div>

  <!-- ── Bottom Navigation ── -->

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/art.js"></script>
  <script src="../js/supabase.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/professions.js"></script>
</body>
</html>
